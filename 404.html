<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Financial Path Not Found | Stackly Wealth Advisory</title>
    <meta name="description" content="The page you're looking for may have moved or doesn't exist. Return to Stackly Wealth Advisory.">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/error.css">
</head>
<body>

    <div class="error-page-wrapper">
        <!-- Floating Gold Canvas Particles -->
        <canvas id="errorCanvas" class="error-canvas-bg"></canvas>

        <div class="error-content-box">
            <!-- Rotating Luxury Financial Rings -->
            <div class="error-visual-container">
                <div class="financial-ring-outer"></div>
                <div class="financial-ring-inner"></div>
                <div class="financial-ring-center">
                    <i class="fa-solid fa-compass error-icon-shield"></i>
                </div>
            </div>

            <!-- 404 Typography -->
            <div class="error-huge-number">4<span>0</span>4</div>
            <h1 class="error-title">Looks Like This Financial Path Doesn't Exist</h1>
            <p class="error-desc">The page you're looking for may have moved, expired, or is currently reserved for private advisory clients.</p>

            <div class="error-actions">
                <button type="button" onclick="window.history.back()" class="btn btn-outline btn-lg">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Go Back</span>
                </button>
                <a href="index.html" class="btn btn-primary btn-lg">
                    <i class="fa-solid fa-house"></i>
                    <span>Back to Home</span>
                </a>
            </div>
        </div>
    </div>

    <!-- GSAP & Main Unified JS Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/script.js"></script>
